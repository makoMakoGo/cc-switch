swarm:
  name: cc-switch-notes-factcheck
  workspace: ..
  mode: parallel
  model: xiaomi-token-plan/mimo-v2.5-pro:xhigh
  agents:
    inventory:
      role: note-audit-inventory
      task: |
        You are preparing a high-concurrency audit of docs/cc-switch-source-notes.md.

        Goal: create a worklist that lets many agents redundantly fact-check the notes.

        Rules:
        - Work in /home/travis/01-workspace/cc-switch.
        - Treat source files as authoritative; the notes are suspect until verified.
        - Do not use the network.
        - Do not edit docs/cc-switch-source-notes.md in this step.
        - Do not run broad formatters or project-wide test suites.
        - Create autoresearch/cc-switch-notes/ before writing outputs.
        - Use repository tools and direct source reads to identify claims with concrete file:line, counts, module names, command names, and architecture descriptions.
        - A claim is actionable only if it can be checked against source or repo metadata.

        Inspect:
        - docs/cc-switch-source-notes.md
        - src-tauri/src/**/*.rs
        - src/**/*.ts and src/**/*.tsx as needed
        - package.json, src-tauri/Cargo.toml, src-tauri/tauri.conf.json as needed

        Write autoresearch/cc-switch-notes/01-inventory.md with:
        1. A chapter map for all note sections.
        2. A prioritized list of concrete claims to verify, grouped by chapter.
        3. Source files each verifier should inspect.
        4. Obvious internal inconsistencies in the notes themselves.
        5. A warning that later verifier agents must independently re-check source instead of trusting this inventory.
    ch1_architecture_source_trace:
      role: architecture-source-trace-fact-checker
      waits_for:
      - inventory
      task: |
        You are one of several independent agents verifying the same notes from a different angle.

        Goal: Chapter 1 source-trace pass: follow startup, setup, invoke handler, provider switch, proxy switch, and cleanup call chains end to end.

        Scope:
        - 第 1 章：架构全景
        - Application lifecycle, Tauri setup, plugin registration, invoke handler, startup/import/sync loops, shutdown cleanup.
        - Provider switch and proxy switch data-flow claims.

        Rules:
        - Work in /home/travis/01-workspace/cc-switch.
        - Source code and repo metadata are authoritative; the notes are suspect until verified.
        - Do not use the network.
        - Do not edit docs/cc-switch-source-notes.md in verifier/synthesis/auditor steps; only repair agents may edit it.
        - Do not run broad formatters or project-wide test suites.
        - Prefer exact source-grounded findings over broad commentary.
        - For every non-ok finding, include source evidence with file paths and line numbers or exact repo metadata.
        - Do not trust any other verifier's conclusion; independently re-check source.
        - Be intentionally redundant: if a claim looks suspicious, verify it even if another agent likely will.

        Read first:
        - autoresearch/cc-switch-notes/01-inventory.md

        Inspect as needed:
        - src-tauri/src/lib.rs
        - src-tauri/src/commands/**/*.rs
        - src-tauri/src/services/**/*.rs
        - src-tauri/src/config.rs

        Write autoresearch/cc-switch-notes/02-ch1-source-trace-findings.md with one finding per issue:
        - note location: chapter/heading and quoted claim
        - verdict: hallucination | wrong | stale | unsupported | ambiguous | ok
        - source evidence: file paths and line numbers or repo metadata
        - exact replacement text when a fix is needed
        - severity: high for misleading architecture/API claims, medium for stale numbers, low for wording
    ch1_architecture_skeptic:
      role: architecture-skeptic-fact-checker
      waits_for:
      - inventory
      task: |
        You are one of several independent agents verifying the same notes from a different angle.

        Goal: Chapter 1 adversarial pass: assume architecture statements are fabricated until source proves them.

